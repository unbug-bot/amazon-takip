name: amazon-takip
on:
  schedule:
    - cron: '17 */12 * * *'   # 12 saatte bir: Türkiye saatiyle 03:17 ve 15:17
  workflow_dispatch:
    inputs:
      mod:
        description: 'kesif = önce keşif, bitince fiyat/stok kontrolü; normal = dönüşümlü; sayfa = yalnızca sayfayı yenile'
        type: choice
        options: [kesif, normal, sayfa]
        default: kesif
      sayfa:
        description: 'Açılacak sayfa sayısı (en fazla 120)'
        default: '120'
      grup:
        description: 'Hangi takipler çalışsın'
        type: choice
        options: [hepsi, saat, parfum, pantolon, gomlek]
        default: hepsi

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: amazon-takip
  cancel-in-progress: false

jobs:
  takip:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Europe/Istanbul
      GITHUB_TOKEN: ${{ github.token }}
      MOD: ${{ inputs.mod || 'kesif' }}
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Paketler
        run: pip install -r requirements.txt

      - name: Tarayıcı
        if: env.MOD != 'sayfa'
        run: python -m playwright install --with-deps chromium

      # Tek veritabanı GitHub'daki 'veri' dalında. Mac kullanıyorsa (kilit varsa) bu çalışma atlanır.
      - name: Veriyi al
        id: al
        run: |
          if [ "$MOD" = "sayfa" ]; then python senkron.py oku; exit $?; fi
          set +e
          python senkron.py al github
          kod=$?
          set -e
          if [ $kod -eq 3 ]; then echo "atla=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          exit $kod

      - name: Tara
        if: steps.al.outputs.atla != '1'
        env:
          SAYFA_BUTCESI: ${{ inputs.sayfa || '120' }}
          GRUP: ${{ inputs.grup }}
        run: python takip.py

      - name: Veriyi geri yaz
        if: always() && steps.al.outcome == 'success' && steps.al.outputs.atla != '1' && env.MOD != 'sayfa'
        run: python senkron.py ver github

      - uses: actions/upload-pages-artifact@v3
        if: always() && steps.al.outputs.atla != '1'
        with:
          path: site

      - id: yayin
        if: always() && steps.al.outputs.atla != '1'
        uses: actions/deploy-pages@v4
