# Amazon.com.tr takip ayarları. Mac ve GitHub aynı dosyayı kullanır:
# asıl kopya GitHub'daki config.yaml'dır, Mac her taramadan önce onu indirir.

ayarlar:
  min_indirim_yuzde: 5        # son fiyata göre en az bu kadar düşüş = indirim
  yeni_urun_bildir: false

takipler:
  # Erkek pantolon, bel 34 / boy 34. Beden etiketindeki sayılar tam olarak
  # [34, 34] ise eşleşir: "34/34", "W34 L34", "34W x 34L", "Bel 34 Boy 34".
  - id: pantolon_34_34
    ad: "Pantolon 34/34"
    aramalar:
      - "erkek pantolon 34/34"
      - "erkek jean pantolon W34 L34"
      - "erkek chino pantolon 34/34"
      - "erkek kumaş pantolon 34/34"
    beden: {tip: bel_boy, bel: 34, boy: 34}
    baslikta_gerekli:
      - ["pantolon", "jean", "kot", "chino", "trousers", "pants"]
    baslikta_olmamali: ["kadın", "kız çocuk", "erkek çocuk", "şort", "bermuda", "eşofman"]
    sayfa_sayisi: 3
    yeniden_tarama_gun: 7     # 34/34'ü olmayan ürüne kaç günde bir yeniden bakılsın

  # ---- Parfümler. Arama sonucu fiyatıyla takip edilir. Her ml ayrı satırdır.
  # gerekli: başlıkta (boşluk ve kesme işaretleri yok sayılarak) hepsi geçmeli
  # haric: bu kelimeler geçerse elenir (muadil, set, deo, EDT, cologne vb. zaten her zaman elenir)
  # konsantrasyon edp: başlıkta EDP / Eau de Parfum yazmayan ilan alınmaz
  - id: creed_aventus
    ad: "Creed Aventus"
    aramalar: ["Creed Aventus"]
    sayfa_sayisi: 2
    parfum: {gerekli: ["aventus"], haric: ["absolu", "for her", "kadın"], konsantrasyon: serbest}

  - id: dior_sauvage_elixir
    ad: "Dior Sauvage Elixir"
    aramalar: ["Dior Sauvage Elixir"]
    sayfa_sayisi: 2
    parfum: {gerekli: ["dior", "sauvage", "elixir"], konsantrasyon: serbest}

  - id: pdm_layton
    ad: "Parfums de Marly Layton"
    aramalar: ["Parfums de Marly Layton"]
    sayfa_sayisi: 2
    parfum: {gerekli: ["layton"], haric: ["exclusif"], konsantrasyon: serbest}

  - id: ysl_la_nuit
    ad: "YSL La Nuit de L'Homme Le Parfum"
    aramalar: ["La Nuit de L'Homme Le Parfum"]
    sayfa_sayisi: 2
    parfum: {gerekli: ["la nuit de l homme", "le parfum"], haric: ["electrique", "intense", "frozen"], konsantrasyon: serbest}

  - id: bleu_de_chanel
    ad: "Bleu de Chanel EDP"
    aramalar: ["Bleu de Chanel Eau de Parfum"]
    sayfa_sayisi: 2
    parfum: {gerekli: ["bleu de chanel"], haric: ["exclusif"], konsantrasyon: edp}

  - id: jpg_le_male_elixir
    ad: "Jean Paul Gaultier Le Male Elixir"
    aramalar: ["Le Male Elixir"]
    sayfa_sayisi: 2
    parfum: {gerekli: ["le male", "elixir"], haric: ["absolu"], konsantrasyon: serbest}

  # Mavi Jeans gömlek, XXL. "Mavi" aynı zamanda renk olduğu için marka
  # ürün sayfasındaki marka satırından (bylineInfo) doğrulanır.
  - id: mavi_gomlek_xxl
    ad: "Mavi gömlek XXL"
    aramalar: ["Mavi Jeans erkek gömlek", "Mavi erkek gömlek"]
    markalar: ["Mavi"]
    beden: {tip: harf, esdegerler: ["xxl", "2xl", "xx-large", "xxlarge", "2x-large", "2xlarge"]}
    baslikta_gerekli:
      - ["gömlek", "gomlek", "shirt"]
    baslikta_olmamali: ["kadın", "çocuk", "tişört", "t-shirt"]
    sayfa_sayisi: 3
    yeniden_tarama_gun: 7

  # ---- Saatler: yalnızca otomatik, safir camlı, bu markalardan, en fazla 38.000 TL.
  # Arama aşamasında yalnızca marka, fiyat ve kuvars/solar kelimesine bakılır.
  # Otomatik mekanizma ve safir cam ürün sayfasında doğrulanır; emin olunamazsa elenir.
  - id: saat_otomatik_safir
    ad: "Otomatik safir camlı saatler (en fazla 38.000 TL)"
    aramalar: ["Seiko otomatik saat", "Citizen otomatik saat", "Orient otomatik saat",
               "Lorus otomatik saat", "Alba otomatik saat", "Bulova otomatik saat",
               "Tissot otomatik saat", "Certina otomatik saat", "Hamilton otomatik saat",
               "Glycine otomatik saat", "Mido otomatik saat",
               "Citizen Tsuyosa", "Orient Star", "Seiko Presage", "Seiko Prospex",
               "Tissot PRX Powermatic", "Certina DS Powermatic", "Hamilton Khaki Field Auto",
               "Mido Multifort", "Glycine Combat"]
    sayfa_sayisi: 2
    arama_saat: 72            # saat aramaları 3 günde bir yenilenir
    baslikta_gerekli:
      - ["seiko", "citizen", "orient", "lorus", "alba", "bulova", "tissot", "certina", "hamilton", "glycine", "mido"]
    baslikta_olmamali: ["quartz", "kuvars", "eco-drive", "eco drive", "solar", "yedek", "uyumlu"]
    yeniden_tarama_gun: 7
    saat:
      markalar: ["Seiko", "Citizen", "Orient", "Lorus", "Alba", "Bulova", "Tissot", "Certina", "Hamilton", "Glycine", "Mido"]
      fiyat_ust: 38000


# GitHub taramaları (12 saatte bir, 120 sayfa; bkz. .github/workflows/takip.yml)
online:
  bekleme_saniye: [20, 40]    # sayfalar arası bekleme
  kontrol_saat: 4             # takipteki ürün en erken kaç saatte bir yeniden kontrol edilsin
  kontrol_azami_saat: 24      # keşif sürerken bile hiçbir ürün bundan uzun süre kontrolsüz kalmaz
  arama_saat_bedensiz: 6      # parfüm aramaları kaç saatte bir yenilensin
  arama_saat_bedenli: 24      # pantolon/gömlek aramaları kaç saatte bir yenilensin

# Mac taramaları (./amazon.sh ile elle başlatılır)
mac:
  bekleme_saniye: [8, 15]     # ev internetinde daha kısa bekleme yeterli
  azami_sayfa: 500            # bir Mac taramasında açılabilecek en fazla sayfa
