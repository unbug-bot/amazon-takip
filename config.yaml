# Amazon.com.tr takip ayarları. Değiştirdikten sonra yeniden kurulum gerekmez.

ayarlar:
  headless: true              # CAPTCHA sıklaşırsa false yap (pencere açılır)
  bekleme_saniye: [4, 8]      # sayfa yüklemeleri arası rastgele bekleme
  min_indirim_yuzde: 5        # son fiyata göre en az bu kadar düşüş = İNDİRİM
  max_sayfa_yukleme: 400      # bir çalıştırmadaki üst sınır
  yeni_urun_bildir: false     # true: ilk kez görülen stoktaki ürünü de bildir
  telegram:                   # telefona bildirim için (isteğe bağlı)
    bot_token: ""
    chat_id: ""

# Bu takiplerin eski kayıtları bir sonraki çalışmada silinir (tekrar çalışırsa iş yapmaz).
veri_sil: [dior_parfum]

takipler:
  # Erkek pantolon, bel 34 / boy 34. Beden etiketindeki sayılar tam olarak
  # [34, 34] ise eşleşir: "34/34", "W34 L34", "34W x 34L", "Bel 34 Boy 34".
  - id: pantolon_34_34
    ad: "Pantolon 34/34"
    aramalar:
      - "erkek pantolon 34/34"
      - "erkek jean pantolon W34 L34"
      - "erkek chino pantolon 34/34"
      - "erkek kumaş pantolon 34/34"
    beden: {tip: bel_boy, bel: 34, boy: 34}
    baslikta_gerekli:
      - ["pantolon", "jean", "kot", "chino", "trousers", "pants"]
    baslikta_olmamali: ["kadın", "kız çocuk", "erkek çocuk", "şort", "bermuda", "eşofman"]
    sayfa_sayisi: 3
    yeni_urun_limiti: 40      # her çalıştırmada en çok kaç yeni ürün sayfası açılsın
    yeniden_tarama_gun: 7     # 34/34'ü olmayan ürüne kaç günde bir yeniden bakılsın
    hedef_fiyat: null         # ör. 800 -> 800 TL ve altı ayrıca bildirilir

  # ---- Parfümler. Arama sonucu fiyatıyla takip edilir. Her ml ayrı satırdır.
  # gerekli: başlıkta (boşluk ve kesme işaretleri yok sayılarak) hepsi geçmeli
  # haric: bu kelimeler geçerse elenir (muadil, set, deo, EDT, cologne vb. zaten her zaman elenir)
  # konsantrasyon edp: başlıkta EDP / Eau de Parfum yazmayan ilan alınmaz
  - id: creed_aventus
    ad: "Creed Aventus"
    aramalar: ["Creed Aventus"]
    sayfa_sayisi: 2
    parfum: {gerekli: ["aventus"], haric: ["absolu", "for her", "kadın"], konsantrasyon: serbest}

  - id: dior_sauvage_elixir
    ad: "Dior Sauvage Elixir"
    aramalar: ["Dior Sauvage Elixir"]
    sayfa_sayisi: 2
    parfum: {gerekli: ["dior", "sauvage", "elixir"], konsantrasyon: serbest}

  - id: pdm_layton
    ad: "Parfums de Marly Layton"
    aramalar: ["Parfums de Marly Layton"]
    sayfa_sayisi: 2
    parfum: {gerekli: ["layton"], haric: ["exclusif"], konsantrasyon: serbest}

  - id: ysl_la_nuit
    ad: "YSL La Nuit de L'Homme Le Parfum"
    aramalar: ["La Nuit de L'Homme Le Parfum"]
    sayfa_sayisi: 2
    parfum: {gerekli: ["la nuit de l homme", "le parfum"], haric: ["electrique", "intense", "frozen"], konsantrasyon: serbest}

  - id: bleu_de_chanel
    ad: "Bleu de Chanel EDP"
    aramalar: ["Bleu de Chanel Eau de Parfum"]
    sayfa_sayisi: 2
    parfum: {gerekli: ["bleu de chanel"], haric: ["exclusif"], konsantrasyon: edp}

  - id: jpg_le_male_elixir
    ad: "Jean Paul Gaultier Le Male Elixir"
    aramalar: ["Le Male Elixir"]
    sayfa_sayisi: 2
    parfum: {gerekli: ["le male", "elixir"], haric: ["absolu"], konsantrasyon: serbest}

  # Mavi Jeans gömlek, XXL. "Mavi" aynı zamanda renk olduğu için marka
  # ürün sayfasındaki marka satırından (bylineInfo) doğrulanır.
  - id: mavi_gomlek_xxl
    ad: "Mavi gömlek XXL"
    aramalar: ["Mavi Jeans erkek gömlek", "Mavi erkek gömlek"]
    markalar: ["Mavi"]
    beden: {tip: harf, esdegerler: ["xxl", "2xl", "xx-large", "xxlarge", "2x-large", "2xlarge"]}
    baslikta_gerekli:
      - ["gömlek", "gomlek", "shirt"]
    baslikta_olmamali: ["kadın", "çocuk", "tişört", "t-shirt"]
    sayfa_sayisi: 3
    yeni_urun_limiti: 40
    yeniden_tarama_gun: 7
    hedef_fiyat: null

# Yalnızca GitHub (online) sürümü için. Saatte 2 çalışma x 8 sayfa = günde ~380 sayfa, güne yayılmış.
online:
  sayfa_butcesi: 8            # bir çalışmada açılacak sayfa sayısı
  bekleme_saniye: [20, 40]    # sayfalar arası bekleme
  kontrol_saat: 4             # takipteki pantolon/gömlek varyantı en geç kaç saatte bir kontrol edilsin
  arama_saat_bedensiz: 6      # parfüm arama sayfaları kaç saatte bir yenilensin
  arama_saat_bedenli: 24      # pantolon/gömlek aramaları (yeni ürün keşfi) kaç saatte bir
